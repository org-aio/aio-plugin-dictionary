[package]
name = "aio-plugin-dictionary-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aio-plugin-dictionary-model = { path = "../model" }
aio-plugin-identity-server = { git = "https://github.com/zjarlin/aio-plugin-identity.git", rev = "d689b45e9a2070721d953747e361f6fb7035f61f" }
anyhow = "1.0.99"
async-trait = "0.1.89"
axum = "0.8.6"
dill = "0.15.0"
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio-rustls"] }
uuid = { version = "1.18.1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
