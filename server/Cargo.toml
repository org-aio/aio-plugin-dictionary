[package]
name = "aio-plugin-dictionary-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aio-plugin-dictionary-model = { path = "../model" }
az-plugin-process = { git = "https://github.com/org-aio/aio-platform.git", rev = "f85c8ef8f4574dbd9963a2800144d76495089392" }
serde_json = "1.0.145"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "process", "time"] }
anyhow = "1.0.99"
async-trait = "0.1.89"
axum = "0.8.6"
dill = "0.15.0"
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio-rustls", "json", "uuid"] }
uuid = { version = "1.18.1", features = ["v4"] }

[dev-dependencies]
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3.23.0"

[lints]
workspace = true
